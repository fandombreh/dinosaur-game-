<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Dinosaur Game Replica</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff; }
    canvas { border: none; }
  </style>
</head>
<body>
<script>
let dino;
let obstacles = [];
let ground;
let clouds = [];
let score = 0;
let highScore = 0;
let gameOver = false;
let gameSpeed = 6;

function setup() {
  createCanvas(600, 150);
  dino = new Dino();
  ground = new Ground();
  clouds.push(new Cloud());
  textFont('Courier New');
}

function draw() {
  background(255);
  
  if (!gameOver) {
    ground.show();
    ground.update();
    
    if (frameCount % max(50, 100 - floor(score / 100)) == 0) {
      obstacles.push(new Obstacle());
    }
    
    if (frameCount % 150 == 0) {
      clouds.push(new Cloud());
    }
    
    for (let i = clouds.length - 1; i >= 0; i--) {
      clouds[i].show();
      clouds[i].update();
      if (clouds[i].offscreen()) {
        clouds.splice(i, 1);
      }
    }
    
    dino.show();
    dino.update();
    
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].show();
      obstacles[i].update();
      if (obstacles[i].hits(dino)) {
        gameOver = true;
        highScore = max(highScore, floor(score));
      }
      if (obstacles[i].offscreen()) {
        obstacles.splice(i, 1);
      }
    }
    
    score += 0.1;
    gameSpeed = 6 + score / 1000;
    
    textSize(12);
    textAlign(RIGHT);
    fill(83);
    let scoreStr = floor(score).toString().padStart(5, '0');
    text('HI ' + highScore.toString().padStart(5, '0') + ' ' + scoreStr, width - 10, 20);
  } else {
    textSize(12);
    textAlign(CENTER);
    fill(83);
    text('GAME OVER', width / 2, height / 2 - 10);
    text('Press SPACE to Restart', width / 2, height / 2 + 10);
  }
}

function keyPressed() {
  if (key == ' ' && !gameOver) {
    dino.jump();
  }
  if (key == ' ' && gameOver) {
    resetGame();
  }
}

class Dino {
  constructor() {
    this.x = 50;
    this.y = height - 20;
    this.w = 44;
    this.h = 47;
    this.vy = 0;
    this.gravity = 0.6;
    this.lift = -12;
    this.groundY = height - 20;
    this.frame = 0;
    this.animationSpeed = 0.2;
  }
  
  jump() {
    if (this.y == this.groundY) {
      this.vy = this.lift;
    }
  }
  
  update() {
    this.vy += this.gravity;
    this.y += this.vy;
    if (this.y > this.groundY) {
      this.y = this.groundY;
      this.vy = 0;
      this.frame += this.animationSpeed;
    }
  }
  
  show() {
    fill(83);
    noStroke();
    // T-Rex pixel art (approximated)
    let legFrame = floor(this.frame % 2);
    // Body
    rect(this.x + 8, this.y - this.h + 10, 28, 20);
    // Head
    rect(this.x + 28, this.y - this.h + 5, 16, 15);
    // Arm
    rect(this.x + 20, this.y - 20, 8, 10);
    // Eye
    fill(255);
    rect(this.x + 36, this.y - this.h + 8, 2, 2);
    fill(83);
    // Legs (alternate for running animation)
    if (legFrame == 0 || this.y < this.groundY) {
      rect(this.x + 10, this.y - 10, 8, 10);
      rect(this.x + 20, this.y - 5, 8, 5);
    } else {
      rect(this.x + 10, this.y - 5, 8, 5);
      rect(this.x + 20, this.y - 10, 8, 10);
    }
  }
}

class Obstacle {
  constructor() {
    this.cacti = [];
    let numCacti = random([1, 2]);
    for (let i = 0; i < numCacti; i++) {
      let w = random([15, 25]);
      let h = random([25, 40]);
      this.cacti.push({ x: width + i * 20, y: height - h, w: w, h: h });
    }
    this.w = numCacti * 20 + this.cacti[0].w;
  }
  
  update() {
    for (let cactus of this.cacti) {
      cactus.x -= gameSpeed;
    }
  }
  
  show() {
    fill(83);
    noStroke();
    for (let cactus of this.cacti) {
      rect(cactus.x, cactus.y, cactus.w, cactus.h);
      if (cactus.w > 15) {
        rect(cactus.x + 5, cactus.y - 10, 10, 10); // Arm detail
      }
    }
  }
  
  offscreen() {
    return this.cacti[0].x < -this.w;
  }
  
  hits(dino) {
    for (let cactus of this.cacti) {
      if (dino.x + dino.w - 10 > cactus.x && dino.x + 10 < cactus.x + cactus.w && dino.y > cactus.y) {
        return true;
      }
    }
    return false;
  }
}

class Ground {
  constructor() {
    this.y = height - 10;
    this.markings = [];
    for (let i = 0; i < 30; i++) {
      this.markings.push({ x: random(width), type: floor(random(3)) });
    }
  }
  
  update() {
    for (let m of this.markings) {
      m.x -= gameSpeed;
      if (m.x < -width) {
        m.x += width * 2;
      }
    }
  }
  
  show() {
    stroke(83);
    strokeWeight(2);
    line(0, this.y, width, this.y);
    for (let m of this.markings) {
      if (m.type == 0) {
        point(m.x, this.y);
      } else if (m.type == 1) {
        line(m.x, this.y, m.x + 4, this.y);
      } else {
        noStroke();
        fill(83);
        rect(m.x, this.y - 2, 6, 2);
        stroke(83);
        strokeWeight(2);
      }
    }
  }
}

class Cloud {
  constructor() {
    this.x = width;
    this.y = random(20, 50);
    this.w = random(40, 80);
    this.h = 10;
  }
  
  update() {
    this.x -= gameSpeed * 0.2;
  }
  
  show() {
    noStroke();
    fill(200);
    rect(this.x, this.y, this.w, this.h, 5);
    rect(this.x + 10, this.y - 5, this.w - 20, 5, 5);
  }
  
  offscreen() {
    return this.x < -this.w;
  }
}

function resetGame() {
  obstacles = [];
  clouds = [];
  score = 0;
  gameSpeed = 6;
  gameOver = false;
  dino = new Dino();
  ground = new Ground();
  clouds.push(new Cloud());
}
</script>
</body>
</html>
